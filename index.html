<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>С Днём Рождения, брат!</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #fbd3e9, #bb377d);
      color: white;
      text-align: center;
      padding: 50px;
      margin: 0;
      overflow: hidden;
    }
    .card {
      background-color: rgba(0, 0, 0, 0.3);
      padding: 30px;
      border-radius: 15px;
      display: inline-block;
      max-width: 600px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }
    h1 {
      font-size: 36px;
      margin-bottom: 20px;
    }
    p {
      font-size: 20px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>С Днём Рождения, брат! 🎉</h1>
    <p>
      Ты не просто родной человек — ты опора, с которой можно пройти всё.<br>
      Пусть в жизни будет большеfgdgdfg453434653524365 света, меньше тревог и только настоящие рядом.<br>
      Я горжусь тобой и всегда рядом, что бы ни случилось. ❤️3123123
    </p>
  </div>

  <!-- Подключаем библиотеку для конфетти -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti"></script>
  <script>
    // Функция для запуска анимации хлопушек
    function shootConfetti() {
      var duration = 3 * 1000;  // длительность (3 секунды)
      var animationEnd = Date.now() + duration;
      
      var interval = setInterval(function() {
        var timeLeft = animationEnd - Date.now();
        if (timeLeft <= 0) {
          return clearInterval(interval);
        }
        confetti({
          particleCount: 5,
          angle: 60,
          spread: 50,
          origin: { x: Math.random(), y: Math.random() }
        });
      }, 100);
    }
    
    // Запуск анимации конфетти при загрузке страницы
    window.onload = function() {
      shootConfetti();
    };
  </script>
</body>
</html>
